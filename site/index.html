<!doctype html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竹梅活動觀測站｜清大×交大校園活動</title>
<meta name="description" content="竹梅活動觀測站彙整清華大學與陽明交通大學的校園活動：演講、社團、表演、工作坊、市集，一站看完，支援 RSS 與行事曆訂閱。">
<link rel="canonical" href="https://chumei.observe.tw/">
<meta property="og:title" content="竹梅活動觀測站｜清大×交大校園活動">
<meta property="og:description" content="清交校園活動一站看完：校方公告＋社團 IG 動態，支援 RSS 與行事曆訂閱。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="竹梅活動觀測站">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="alternate" type="application/rss+xml" title="竹梅活動 RSS" href="/feeds/all.xml">
<link rel="stylesheet" href="/assets/vendor/maplibre/maplibre-gl.css">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/"><span class="brand-chu">竹</span><span class="brand-mei">梅</span><span class="brand-sub">活動觀測站</span></a>
  <nav class="site-nav">
    <a href="/">活動</a>
    <a href="/calendar/">日曆</a>
    <a href="/subscribe/">訂閱</a>
    <a href="/source/">來源</a>
    <a href="/about/">關於</a>
    <button id="theme-toggle" aria-label="切換深淺色主題">◐</button>
  </nav>
</header>
<main>
  <section class="hero">
    <h1>這禮拜，校園裡有什麼？</h1>
    <p>竹梅自動彙整清大與陽明交大的公開活動——校方公告、社團 IG 都在這裡。<span id="count" aria-live="polite"></span></p>
  </section>
  <section class="filters" aria-label="活動篩選">
    <div class="filter-row"><span class="label">時間</span><span id="f-time"></span>
      <label class="search-hit"><input id="search" type="search" placeholder="搜尋活動、社團、地點…" aria-label="搜尋活動"></label>
    </div>
    <details id="more-filters">
      <summary>更多篩選</summary>
      <div class="filter-row"><span class="label">學校</span><span id="f-school"></span></div>
      <div class="filter-row"><span class="label">校區</span><span id="f-campus"></span></div>
      <div class="filter-row"><span class="label">類型</span><span id="f-cat"></span></div>
      <div class="filter-row"><span class="label">主辦</span><span id="f-org"></span></div>
    </details>
  </section>
  <section id="map-view" class="results-section" aria-labelledby="map-heading">
    <div class="section-head">
      <h2 id="map-heading">活動地圖</h2>
      <span id="map-count" class="result-count"></span>
    </div>
    <div id="map"></div>
    <p id="map-note" class="map-note"></p>
  </section>
  <section class="results-section" aria-labelledby="list-heading">
    <div class="section-head">
      <h2 id="list-heading">活動卡片</h2>
      <span id="list-count" class="result-count"></span>
    </div>
    <div id="event-list" class="grid"></div>
  </section>
</main>
<footer class="site-footer">
  <p>竹梅活動觀測站彙整清大、陽明交大公開活動資訊；內容以主辦單位公告為準。</p>
  <p><a href="/subscribe/">RSS / 行事曆訂閱</a> ・ <a href="/source/">資料來源</a> ・ <a href="/about/">關於與回報</a></p>
</footer>
<script src="/assets/vendor/maplibre/maplibre-gl.js" defer></script>
<script src="/assets/app.js" defer></script>
</body>
</html>
